name: DevOps Application CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # =========================
  # 1. CHECKOUT
  # =========================
  checkout:
    name: Checkout Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4


  # =========================
  # 2. BUILD & TEST
  # =========================
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Spring Boot Backend
        working-directory: backend
        run: mvn clean package -DskipTests=false

      - name: Build React Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build


  # =========================
  # 3. SONARQUBE / CODE QUALITY
  # =========================
  code-quality:
    name: Code Quality - SonarQube
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: SonarQube Scan
        run: echo "SonarQube Code Quality Scan"


  # =========================
  # 4. OWASP
  # =========================
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: DevOps-Application
          path: .
          format: HTML
          out: reports


  # =========================
  # 5. DOCKER BUILD
  # =========================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - dependency-check

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t devops-backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t devops-frontend ./frontend


  # =========================
  # 6. TRIVY SECURITY SCAN
  # =========================
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t devops-backend ./backend

      - name: Build Frontend Image
        run: docker build -t devops-frontend ./frontend

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Backend Image
        run: trivy image --severity HIGH,CRITICAL devops-backend

      - name: Scan Frontend Image
        run: trivy image --severity HIGH,CRITICAL devops-frontend


  # =========================
  # 7. TERRAFORM INIT
  # =========================
  terraform-init:
    name: Terraform Init
    runs-on: ubuntu-latest
    needs: trivy-scan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init


  # =========================
  # 8. TERRAFORM VALIDATE
  # =========================
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: terraform-init

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate


  # =========================
  # 9. TERRAFORM PLAN
  # =========================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan


  # =========================
  # 10. TERRAFORM APPLY
  # =========================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve


  # =========================
  # 11. ANSIBLE
  # =========================
  ansible-deploy:
    name: Ansible Deployment
    runs-on: ubuntu-latest
    needs: terraform-apply

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Run Ansible
        working-directory: ansible
        run: |
          ansible-playbook -i inventory deploy.yml


  # =========================
  # 12. KUBERNETES / EKS
  # =========================
  kubernetes-deploy:
    name: Kubernetes EKS Deployment
    runs-on: ubuntu-latest
    needs: ansible-deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Update EKS Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name devops-application-eks

      - name: Deploy Namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Deploy Backend
        run: kubectl apply -f k8s/backend.yaml

      - name: Deploy Frontend
        run: kubectl apply -f k8s/frontend.yaml

      - name: Check Kubernetes Pods
        run: kubectl get pods -A

      - name: Check Kubernetes Services
        run: kubectl get svc -A


  # =========================
  # 13. FINAL OUTPUT
  # =========================
  deployment-status:
    name: Final Deployment Status
    runs-on: ubuntu-latest
    needs: kubernetes-deploy

    steps:
      - name: Deployment Successful
        run: |
          echo "===================================="
          echo "DEVOPS APPLICATION DEPLOYED"
          echo "Spring Boot + React"
          echo "Terraform + Ansible + Kubernetes"
          echo "CI/CD Pipeline Completed Successfully"
          echo "===================================="
