name: DevOps Application CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # =========================================================
  # 1. BUILD & TEST
  # =========================================================
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------
      # Java / Maven
      # -------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java Version
        run: java -version

      - name: Check Maven Version
        run: mvn -version

      - name: Build Spring Boot Backend
        working-directory: backend
        run: |
          mvn clean package -DskipTests=false

      # -------------------------
      # Node / React
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Node Version
        run: |
          node --version
          npm --version

      - name: Install React Dependencies
        working-directory: frontend
        run: npm install

      - name: Build React Frontend
        working-directory: frontend
        run: npm run build


  # =========================================================
  # 2. CODE QUALITY
  # =========================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-test

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: SonarQube Check
        run: |
          echo "Code Quality Check"
          echo "SonarQube integration can be enabled using SONAR_TOKEN."


  # =========================================================
  # 3. OWASP DEPENDENCY CHECK
  # =========================================================
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build-test

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: DevOps-Application
          path: .
          format: HTML
          out: reports


  # =========================================================
  # 4. DOCKER BUILD
  # =========================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - dependency-check

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t devops-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t devops-frontend:latest ./frontend

      - name: Show Docker Images
        run: |
          docker images


  # =========================================================
  # 5. TRIVY SECURITY SCAN
  # =========================================================
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build -t devops-backend:latest ./backend

      - name: Build Frontend Image
        run: |
          docker build -t devops-frontend:latest ./frontend

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Backend Image
        run: |
          trivy image --severity HIGH,CRITICAL devops-backend:latest

      - name: Scan Frontend Image
        run: |
          trivy image --severity HIGH,CRITICAL devops-frontend:latest


  # =========================================================
  # 6. TERRAFORM INIT
  # =========================================================
  terraform-init:
    name: Terraform Init
    runs-on: ubuntu-latest
    needs: trivy-scan

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init


  # =========================================================
  # 7. TERRAFORM VALIDATE
  # =========================================================
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: terraform-init

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate


  # =========================================================
  # 8. TERRAFORM PLAN
  # =========================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-validate

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # IMPORTANT:
      # AWS credentials fix
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan


  # =========================================================
  # 9. TERRAFORM APPLY
  # =========================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan

    if: github.ref == 'refs/heads/main'

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve


  # =========================================================
  # 10. ANSIBLE
  # =========================================================
  ansible-deploy:
    name: Ansible Deployment
    runs-on: ubuntu-latest
    needs: terraform-apply

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Check Ansible
        run: |
          ansible --version

      - name: Run Ansible Playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory deploy.yml


  # =========================================================
  # 11. KUBERNETES / EKS
  # =========================================================
  kubernetes-deploy:
    name: Kubernetes EKS Deployment
    runs-on: ubuntu-latest
    needs: ansible-deploy

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Update EKS Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name devops-application-eks

      - name: Check EKS Nodes
        run: |
          kubectl get nodes

      - name: Deploy Kubernetes Resources
        run: |
          kubectl apply -f k8s/

      - name: Check Pods
        run: |
          kubectl get pods -A

      - name: Check Services
        run: |
          kubectl get svc -A

      - name: Check Deployments
        run: |
          kubectl get deployments -A


  # =========================================================
  # 12. FINAL STATUS
  # =========================================================
  deployment-status:
    name: Deployment Successful
    runs-on: ubuntu-latest
    needs: kubernetes-deploy

    steps:

      - name: Final Output
        run: |
          echo "=========================================="
          echo "       DEVOPS APPLICATION DEPLOYED"
          echo "=========================================="
          echo ""
          echo "Spring Boot Backend       : SUCCESS"
          echo "React Frontend            : SUCCESS"
          echo "Docker                    : SUCCESS"
          echo "Trivy Security Scan      : SUCCESS"
          echo "Terraform                 : SUCCESS"
          echo "Ansible                   : SUCCESS"
          echo "Kubernetes / EKS          : SUCCESS"
          echo ""
          echo "CI/CD PIPELINE COMPLETED"
          echo "=========================================="
